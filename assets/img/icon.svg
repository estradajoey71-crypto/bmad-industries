      <stop offset="0" stop-color="#141a22"/><stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27e0ff"/><stop offset="0.55" stop-color="#7b61ff"/><stop offset="1" stop-color="#b86bff"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
