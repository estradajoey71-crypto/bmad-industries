  <g fill="#7b61ff"><rect x="198" y="292" width="10" height="44" rx="3"/><rect x="216" y="292" width="10" height="44" rx="3"/><rect x="234" y="292" width="10" height="44" rx="3"/><rect x="252" y="292" width="10" height="44" rx="3"/></g>
