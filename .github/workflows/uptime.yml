# Uptime monitor (runs on GitHub, free for public repositories). A failed run means something customers use
# is down; GitHub emails the account that last changed this file. Backend URLs come from the repository
# variables STORE_URL and DOCS_URL, which deploy/remote-deploy.sh sets after a real deployment.
name: Uptime
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Storefront, downloads, store and BMAD Docs
        env:
          STORE_URL: ${{ vars.STORE_URL }}
          DOCS_URL: ${{ vars.DOCS_URL }}
        run: |
          fail=0
          check() {  # url [expected text]
            code=$(curl -sL -o /tmp/body -w '%{http_code}' --max-time 25 "$1")
            if [ "$code" = 200 ] && { [ -z "${2:-}" ] || grep -q "$2" /tmp/body; }; then echo "ok   $1"; else echo "FAIL $1 → HTTP $code"; fail=1; fi
          }
          check https://estradajoey71-crypto.github.io/bmad-industries/ "BMAD Arcade"
          feed=https://estradajoey71-crypto.github.io/bmad-industries/releases/latest.json
          check "$feed" '"version"'
          for url in $(python3 -c "import json,sys; print(' '.join(a['url'] for a in json.load(open('/tmp/body'))['release']['assets']))"); do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 25 "$url"); [ "$code" = 200 ] && echo "ok   $url" || { echo "FAIL $url → HTTP $code"; fail=1; }
          done
          if [ -n "$STORE_URL" ]; then check "$STORE_URL/api/health" '"ok":true'; else echo "skip store (STORE_URL not set: backend not deployed yet)"; fi
          if [ -n "$DOCS_URL" ]; then check "$DOCS_URL/healthz" '"ok": true'; else echo "skip docs (DOCS_URL not set)"; fi
          exit $fail
